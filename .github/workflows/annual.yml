name: annual

on:
  schedule:
    - cron: "0 4 10 1 *"          # 10 January, 04:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Year to report (YYYY). Default: previous year"
        required: false

permissions:
  contents: write

concurrency:
  group: po3-annual

jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve year
        id: y
        run: |
          if [ -n "${{ inputs.year }}" ]; then Y="${{ inputs.year }}"; else Y=$(( $(date -u +%Y) - 1 )); fi
          echo "year=$Y" >> "$GITHUB_OUTPUT"
      - name: Annual report + Telegram
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m po3 annual --year "${{ steps.y.outputs.year }}" --notify
      - name: Commit report
        run: |
          git config user.name "po3-bot"
          git config user.email "po3-bot@users.noreply.github.com"
          git add reports/annual
          git diff --cached --quiet || git commit -m "annual: ${{ steps.y.outputs.year }}"
          git push
