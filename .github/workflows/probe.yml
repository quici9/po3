name: probe-data-sources

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to probe (YYYY-MM)"
        required: true
        default: "2026-08"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe histdata and Dukascopy from this runner
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m po3 probe --month "${{ inputs.month }}" --notify
